name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: |
          node tests/smoke.mjs
          node tests/wrapper.mjs
          node tests/deep-wrapper.mjs
          node tests/dnd-bridge.mjs
          node tests/project-fuzz.mjs
          node tests/core-hygiene.mjs
          node tests/search.mjs
          node tests/eboot-decrypter.mjs
          node tests/file-open-policy.mjs
          node tests/assets.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
